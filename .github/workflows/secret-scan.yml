# Scans pushed commits and pull requests for leaked secrets with gitleaks; run it manually (workflow_dispatch) for a full-history scan.
# Actions are pinned to full commit SHAs (verified against the tags noted in comments).
name: secret-scan

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Personal-account repos need no GITLEAKS_LICENSE (organizations do).
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_CONFIG: .gitleaks.toml
          # Least privilege on a public repo: no PR comments (would need write
          # access) and no SARIF artifact that anyone could download.
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
