# Fails when the generated Codex agent wrappers (clients/.codex/agents/) drift from the canonical
# agents (agents/). Fix locally: python scripts/codex-adapter.py agents
name: adapter-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  codex-agents:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Check generated Codex agents
        run: python3 -I scripts/codex-adapter.py agents --check
